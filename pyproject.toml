[project]
name = "super-agent"
version = "0.2.1"
description = "A simple, lightweight, highly intelligent, self-evolving, skill-first agent runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Super Agent contributors" }]
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1,<2"]
postgresql = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
super-agent = "adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/adapter", "src/core", "src/skill", "src/cli.py", "src/super_agent.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "README_cn.md", "README_en.md", "pyproject.toml", "docs", "scripts", "src", "tests", "examples"]

[tool.hatch.build.targets.sdist.force-include]
"tests/eval/README.md" = "tests/eval/README.md"
"tests/eval/reports/token-usage-glm4-9b-20260806/README.md" = "tests/eval/reports/token-usage-glm4-9b-20260806/README.md"
"tests/eval/reports/token-usage-glm4-9b-20260806/humaneval_plus.md" = "tests/eval/reports/token-usage-glm4-9b-20260806/humaneval_plus.md"
"tests/eval/reports/token-usage-glm4-9b-20260806/livecodebench_codegen.md" = "tests/eval/reports/token-usage-glm4-9b-20260806/livecodebench_codegen.md"
"tests/eval/reports/token-usage-glm4-9b-20260806/summary.json" = "tests/eval/reports/token-usage-glm4-9b-20260806/summary.json"
"tests/eval/reports/token-usage-glm4-9b-20260806/task-token-usage.csv" = "tests/eval/reports/token-usage-glm4-9b-20260806/task-token-usage.csv"
"tests/eval/reports/token-usage-glm4-9b-20260806/versions.json" = "tests/eval/reports/token-usage-glm4-9b-20260806/versions.json"
"tests/eval/runner/common.py" = "tests/eval/runner/common.py"
"tests/eval/runner/raw_generate.py" = "tests/eval/runner/raw_generate.py"
"tests/eval/runner/report_token_usage.py" = "tests/eval/runner/report_token_usage.py"
"tests/eval/runner/score_humaneval.py" = "tests/eval/runner/score_humaneval.py"
"tests/eval/runner/score_livecodebench.py" = "tests/eval/runner/score_livecodebench.py"
"tests/eval/runtime/proxy/openllm_adapter.py" = "tests/eval/runtime/proxy/openllm_adapter.py"
"tests/eval/runtime/proxy/siliconflow.yaml" = "tests/eval/runtime/proxy/siliconflow.yaml"
"tests/eval/runtime/proxy/usage_logging.py" = "tests/eval/runtime/proxy/usage_logging.py"
