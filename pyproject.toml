[project]
name = "super-agent"
version = "0.0.17"
description = "A lightweight, configurable, skill-first agent runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Super Agent contributors" }]
dependencies = []

[project.scripts]
super-agent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/cli.py", "src/super_agent.py", "src/cli_commands", "src/core", "src/skill"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "pyproject.toml", "src", "tests", "examples"]
