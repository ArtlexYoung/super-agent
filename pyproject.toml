[project]
name = "super-agent"
version = "0.0.126"
description = "A simple, lightweight, self-evolving, skill-first agent runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Super Agent contributors" }]
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1,<2"]
postgresql = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
super-agent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/adapter", "src/core", "src/skill", "src/cli.py", "src/super_agent.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "README_cn.md", "pyproject.toml", "src", "tests", "examples"]
