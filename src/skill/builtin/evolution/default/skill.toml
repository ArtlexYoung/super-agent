type = "evolution"
description = "Deterministic freshness, recommendation, evaluation, and monitoring settings"

[configuration.freshness]
initial = 70.0
quality_weight = 0.30
recency_weight = 0.20
frequency_weight = 0.15
efficiency_weight = 0.15
reliability_weight = 0.10
replacement_weight = 0.10
recency_decay_days = 7.0
full_frequency_calls_per_week = 5.0
confidence_sample_count = 8.0
token_free_budget = 1500.0
tokens_per_penalty_point = 85.0
latency_free_ms = 1000.0
latency_per_penalty_point = 90.0
token_efficiency_weight = 0.70
empty_output_penalty = 0.30
error_penalty = 0.50

[configuration.recommendation]
low_score_minimum_samples = 3
low_score_threshold = 0.75
low_freshness_minimum_samples = 2
low_freshness_threshold = 45.0
replacement_minimum_followups = 2
replacement_rate_threshold = 0.50
high_average_tokens = 12000.0
high_average_latency_ms = 10000.0
max_evidence_records = 100

[configuration.monitoring]
minimum_samples = 3
minimum_score = 0.75
max_automatic_evaluation_cases = 3
minimum_candidate_score = 0.80
