type = "task"
description = "Run evidence-driven optimization batches through nested specialist Agents"

[configuration]
mode = "loop"
max_steps = 40

[configuration.tools.agent_tasks]
max_tasks = 64
max_wait_seconds = 120
record_mode = "adaptive"
compress_after_tasks = 8
summary_chars = 2000
max_nested_results = 8
agent_selection = "rotate"
circuit_breaker_failures = 1
circuit_breaker_wait_seconds = 30
retry_unavailable_times = 1

[configuration.tools.agent_groups]
max_groups = 16
max_members = 3
default_members = 3
quorum = 2
max_estimated_cost = 0.0
allow_reduced_group = false
require_different_models = true
summary_chars = 1000
